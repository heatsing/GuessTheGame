name: CI

# Runs the full quality gate on every pull request and on every push to the
# default branch (master). The deploy workflow (deploy.yml) is triggered by
# THIS workflow succeeding, so a failing check here blocks production
# deployment.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Lint · Unit tests · Content · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.6+ required: content:check uses --experimental-strip-types
          # to import .ts modules (schemas.ts, match.ts) from .mjs scripts.
          node-version: 22
          cache: npm

      # Frozen, reproducible install — fails if package-lock.json is out of
      # sync with package.json. This is the npm equivalent of `pnpm install
      # --frozen-lockfile` (the project standardizes on npm + package-lock.json).
      - name: Install dependencies (npm ci — frozen lockfile)
        run: npm ci

      # Dependency vulnerability scan. continue-on-error: true so high-severity
      # advisories are surfaced in the run log without blocking the gate — the
      # goal at this stage is visibility, not enforcement.
      - name: Dependency audit (npm audit)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Content validation
        run: npm run content:check

      # Linux CI is unaffected by the Windows NTFS phantom-file bug; the first
      # `next build` with `output: 'export'` succeeds and produces `out/`.
      - name: Production build (static export)
        run: npm run build

      # Assert the static export actually produced the expected entry point.
      # Catches silent build failures where `next build` exits 0 but `out/`
      # is empty or missing index.html (e.g., misconfigured export, phantom
      # file edge cases). Ubuntu runners use bash, so `test -f` is available.
      - name: Assert build output
        run: test -f out/index.html || (echo "Build output missing" && exit 1)

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: out/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # Cache Playwright browser binaries (~/.cache/ms-playwright) keyed by
      # the resolved Playwright version in package-lock.json. Saves ~30–60s
      # of `npx playwright install --with-deps` per run on cache hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
