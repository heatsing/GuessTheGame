name: CI

# Runs the full quality gate on every pull request and on every push to the
# default branch (master). The deploy workflow (deploy.yml) is triggered by
# THIS workflow succeeding, so a failing check here blocks production
# deployment.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Lint · Unit tests · Content · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.6+ required: content:check uses --experimental-strip-types
          # to import .ts modules (schemas.ts, match.ts) from .mjs scripts.
          node-version: 22
          cache: npm

      # Frozen, reproducible install — fails if package-lock.json is out of
      # sync with package.json. This is the npm equivalent of `pnpm install
      # --frozen-lockfile` (the project standardizes on npm + package-lock.json).
      - name: Install dependencies (npm ci — frozen lockfile)
        run: npm ci

      # Dependency vulnerability scan — two-tier enforcement (L-2).
      #
      # Tier 1 (blocking): CRITICAL-severity vulnerabilities in production
      # dependencies fail the build. This is the hard security gate.
      #
      # Tier 2 (advisory): HIGH-severity vulnerabilities are surfaced in the
      # run log but do not block CI. This is non-blocking because the current
      # dependency tree has 3 known HIGH advisories that cannot be resolved
      # without a framework upgrade pending owner approval (guardrail #2):
      #
      #   - next (GHSA-m99w-x7hq-7vfj et al.): advisory range covers ALL
      #     released versions (9.3.4-canary.0 – 16.3.0-preview.7). The
      #     vulnerabilities affect Server Actions, SSR, Image Optimization
      #     API, and rewrites — NONE of which are used in a static-export
      #     app (`output: 'export'`, no server runtime).
      #   - postcss <=8.5.17 (transitive via next): CSS source-map / stringify
      #     issues, only relevant at build time with attacker-controlled CSS.
      #   - sharp <0.35.0 (transitive via next): libvips image-decode CVEs,
      #     only relevant if processing untrusted images server-side.
      #
      # npm's suggested "fix" (downgrade to next@9.3.3) is nonsensical. When
      # a fixed next version is released, the advisory audit will pass clean
      # and this step can be upgraded to blocking.
      - name: Dependency audit — CRITICAL (blocking)
        run: npm audit --omit=dev --audit-level=critical

      - name: Dependency audit — HIGH (advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Content validation
        run: npm run content:check

      # Linux CI is unaffected by the Windows NTFS phantom-file bug; the first
      # `next build` with `output: 'export'` succeeds and produces `out/`.
      - name: Production build (static export)
        run: npm run build

      # Assert the static export actually produced the expected entry point.
      # Catches silent build failures where `next build` exits 0 but `out/`
      # is empty or missing index.html (e.g., misconfigured export, phantom
      # file edge cases). Ubuntu runners use bash, so `test -f` is available.
      - name: Assert build output
        run: test -f out/index.html || (echo "Build output missing" && exit 1)

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: out/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # Cache Playwright browser binaries (~/.cache/ms-playwright) keyed by
      # the resolved Playwright version in package-lock.json. Saves ~30–60s
      # of `npx playwright install --with-deps` per run on cache hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
